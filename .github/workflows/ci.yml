name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build debug package
        run: swift build

      - name: Run unit tests
        run: swift test

      - name: Build release app bundles
        run: ./Scripts/bundle-app.sh
